<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>Aellux Adaptive Tabs</title>
  <script src="../aellux.js" type="text/javascript"></script>
  <script>
    Aellux.init({
      defaultAdaptiveCSS: true
    });

    var start = Date.now();
    document.addEventListener("AelluxAwake", function () {
      var time = Date.now() - start;
      console.log("[Aellux] Awake in " + (time / 1000) + "ms")
    });
    document.addEventListener("AelluxReady", function () {
      var time = Date.now() - start;
      console.log("[Aellux] Ready in " + (time / 1000) + "ms")
    });
  </script>
</head>

<body>
  <div data-aellux-fill-viewport>
    <main data-aellux-fill-parent data-aellux-adaptive style=" background-color: rgba(255 0 0 /10%);">
      <progress data-aellux-adaptive-progress style="margin:auto"></progress>

      <nav data-aellux-persist data-aellux-tab-group>
        <!-- SUPPORTS ANCHOR DIV AND BUTTON -->
        <a data-aellux-tab="profile">Perfil</a>
        <div data-aellux-tab="settings">Configurações</div>
        <button data-aellux-tab="home">
          <span>#</span>
          <span>Home</span>
        </button>
      </nav>

      <section id="home">
        <h1>Home</h1>
        <p>Conteúdo da página inicial.</p>
      </section>

      <section id="profile">
        <h1>Perfil</h1>
        <p>Conteúdo do perfil.</p>
      </section>

      <section id="settings">
        <h1>Configurações</h1>
        <p>Conteúdo das configurações.</p>
      </section>

    </main>
  </div>

</body>

</html>
