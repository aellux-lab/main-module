<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>Aellux Adaptive Tabs</title>
  <script src="../aellux.js" type="text/javascript"></script>
  <script> Aellux.init(); </script>
</head>

<body style="display: none;">

  <main data-aellux-adaptive="tabs">
    <progress data-aellux-adaptive-progress>
      <span class="ux-spinner"></span>
    </progress>

    <nav>
      <!-- SUPPORTS ANCHOR DIV AND BUTTON -->
      <a data-aellux-tab="section#settings" href="#">Perfil</a>
      <div data-aellux-tab="section#settings">Configurações</div>
      <button data-aellux-tab="section#home">
        <span>#</span>
        <span>Home</span>
      </button>
    </nav>

    <section id="home">
      <h1>Home</h1>
      <p>Conteúdo da página inicial.</p>
    </section>

    <section id="profile">
      <h1>Perfil</h1>
      <p>Conteúdo do perfil.</p>
    </section>

    <section id="settings">
      <h1>Configurações</h1>
      <p>Conteúdo das configurações.</p>
    </section>

  </main>

</body>

</html>
